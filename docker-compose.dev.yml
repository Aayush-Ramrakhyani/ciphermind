version: "3.9"

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ciphermind
      POSTGRES_USER: ciphermind
      POSTGRES_PASSWORD: ciphermind
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: development
    env_file: backend/.env.example
    environment:
      DJANGO_SETTINGS_MODULE: ciphermind.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app  # live reload
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: development
    command: celery -A ciphermind worker --loglevel=debug --concurrency=2 --pool=solo
    env_file: backend/.env.example
    environment:
      DJANGO_SETTINGS_MODULE: ciphermind.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_dev_data:
